name: Strategy Alignment

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

jobs:
  strategy-alignment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r EMA-BAND/requirements.txt
          python -m pip install pytest

      - name: Root launcher compile check
        run: python -m py_compile backtest.py

      - name: Compile check
        working-directory: EMA-BAND
        run: python -m compileall -q main.py preflight.py backtest.py core strategies tests

      - name: Root backtest import smoke test
        env:
          PYTHONPATH: .
        run: python -c "import runpy, pathlib; p=pathlib.Path('backtest.py'); print('ROOT_BACKTEST_LAUNCHER_OK' if p.is_file() else 'ROOT_BACKTEST_LAUNCHER_MISSING')"

      - name: Strategy alignment tests
        working-directory: EMA-BAND
        env:
          ENABLE_LIVE_TRADING: "false"
          ENABLE_SHORT: "false"
          EXIT_ON_CANDLE_CLOSE: "true"
          PYTHONPATH: .
        run: pytest -q tests/test/test_backtest_live_alignment.py

  actual-backtest:
    runs-on: ubuntu-latest
    needs: strategy-alignment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r EMA-BAND/requirements.txt

      - name: Real Bybit backtest smoke test
        working-directory: EMA-BAND
        env:
          ENABLE_LIVE_TRADING: "false"
          ENABLE_SHORT: "false"
          EXIT_ON_CANDLE_CLOSE: "true"
        run: |
          echo "=== EMA-BAND / same repository strategy backtest ==="
          python backtest.py --days 3 --capital 1000 --symbol BTCUSDT

      - name: Live/backtest shared-candle replay
        working-directory: EMA-BAND
        env:
          ENABLE_LIVE_TRADING: "false"
          ENABLE_SHORT: "false"
          EXIT_ON_CANDLE_CLOSE: "true"
          PYTHONPATH: .
        run: |
          echo "=== SAME 15m CANDLE SAMPLE: LIVE STRATEGY vs BACKTEST ==="
          pytest -q tests/test/test_backtest_live_alignment.py -k same_candle_sample
