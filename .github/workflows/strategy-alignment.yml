name: Strategy Alignment

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

jobs:
  strategy-alignment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r EMA-BAND/requirements.txt
          python -m pip install pytest

      - name: Compile check
        working-directory: EMA-BAND
        run: python -m compileall -q main.py preflight.py backtest.py core strategies tests

      - name: Strategy alignment tests
        working-directory: EMA-BAND
        env:
          ENABLE_LIVE_TRADING: "false"
          ENABLE_SHORT: "false"
          EXIT_ON_CANDLE_CLOSE: "true"
        env:
          PYTHONPATH: .
        run: pytest -q tests/test/test_backtest_live_alignment.py
